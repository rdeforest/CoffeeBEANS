# The suite on Linux and Windows for every push. macOS minutes cost ten
# times as much on a private repo, so macOS runs only for a release tag
# (v*) or by hand (Actions tab, or `gh workflow run test.yml`).
name: test

on:
  push:
  workflow_dispatch:

# A newer push to the same ref makes the older run moot. A run by hand is
# grouped apart, so asking for macOS does not cancel the push's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
            && '["ubuntu-24.04", "windows-latest", "macos-latest"]'
            || '["ubuntu-24.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A wedged app never exits; the suite alone takes about two minutes.
    timeout-minutes: 20
    steps:
      # Windows git checks out CRLF. The first Windows run then failed "suite
      # does not touch real sketches": hello.coffee came back at 785 bytes,
      # its LF size, so something in the suite rewrote it with LF endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
      - run: npm ci

      # Ubuntu 24.04 (pinned above, not ubuntu-latest, because this is what
      # was measured) has AppArmor refuse unprivileged user namespaces, and
      # without them Chromium's sandbox aborts at launch ("The SUID sandbox
      # helper binary was found, but is not configured correctly").
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm test

      - if: runner.os != 'Linux'
        run: npm test
