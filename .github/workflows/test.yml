# The suite on Linux and Windows for every push. macOS minutes cost ten
# times as much on a private repo, so macOS runs only for a release tag
# (v*) or by hand (Actions tab, or `gh workflow run test.yml`).
name: test

on:
  push:
  workflow_dispatch:

# A newer push to the same ref makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
            && '["ubuntu-latest", "windows-latest", "macos-latest"]'
            || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # A wedged app never exits; the suite alone takes about two minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
      - run: npm ci

      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm test

      - if: runner.os != 'Linux'
        run: npm test
