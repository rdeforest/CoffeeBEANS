<meta charset="utf-8">
<title>CoffeeBEANS</title>
<style>
  :root {
    --coffee: #C0FFEE; --ink: #0b0b0d; --panel: #17171b; --edge: #2a2a30;
    --editor-w: 52ch; --console-h: 8rem; --grip: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid;
    grid-template-rows: auto 1fr var(--grip) var(--console-h);
    background: var(--ink); color: var(--coffee);
    font: 13px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
  }
  header {
    display: flex; gap: .5rem; align-items: center;
    padding: .4rem .6rem; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  header b { letter-spacing: .12em; }
  header .spacer { margin-left: auto; }
  button {
    font: inherit; border: 0; border-radius: 3px; padding: .25rem .6rem; cursor: pointer;
    color: var(--ink); background: var(--coffee);
  }
  /* A button that wraps puts its glyph on one line and its word on the next,
     which reads as two controls. The header would rather run out of room. */
  header button, header span { white-space: nowrap; }
  header button { flex: none; }
  /* Five buttons is more than the bar comfortably holds, so the two that
     only matter while a sketch is running wear their glyph alone. */
  header button.icon { padding: .25rem .5rem; }
  /* If it still does not fit, the meter is what gives -- the status is the
     one thing on this bar you cannot guess from looking at the window. */
  #meter { min-width: 0; overflow: hidden; }
  button.ghost { background: #22222a; color: var(--coffee); }
  button.stop  { background: #ff6b6b; }
  button:disabled { opacity: .35; cursor: default; }
  #status { opacity: .7; min-width: 6rem; text-align: right; }
  #meter  { opacity: .45; font-variant-numeric: tabular-nums; }
  #lines  { opacity: .6; font-variant-numeric: tabular-nums; }
  #lines.over { color: #ff6b6b; opacity: 1; }

  main { display: grid; grid-template-columns: 1fr var(--grip) var(--editor-w); min-height: 0; }
  main.solo { grid-template-columns: 1fr 0 0; }

  .splitter { background: var(--edge); touch-action: none; }
  .splitter:hover, .splitter.dragging { background: var(--coffee); }
  .splitter.v { cursor: col-resize; }
  .splitter.h { cursor: row-resize; }
  main.solo .splitter { display: none; }
  #stage { display: grid; place-items: center; overflow: hidden; background: #000; }
  canvas { image-rendering: pixelated; outline: 1px solid transparent; }
  #stage:focus { outline: none; }
  #stage:focus canvas { outline: 1px solid var(--coffee); }
  #editor { min-width: 0; overflow: hidden; }

  #consolePane {
    display: grid; grid-template-rows: 1fr auto; grid-template-columns: 1fr auto;
    min-height: 0; background: var(--panel);
  }
  /* Only there while a sketch is line paused, so it costs the console nothing
     the rest of the time. */
  #vars {
    grid-row: 1 / span 2; grid-column: 2; width: 36ch; min-height: 0;
    overflow: auto; padding: .3rem 0; border-left: 1px solid var(--edge);
  }
  #vars[hidden] { display: none; }
  .vars-head  { padding: 0 .6rem .2rem; color: #e8c37e; }
  .vars-title { padding: .2rem .6rem 0; opacity: .5; }
  .var { display: flex; gap: .6rem; padding-right: .6rem; white-space: nowrap; }
  .var.none { opacity: .4; padding-left: 1.1rem; }
  .var-name  { flex: none; }
  .var-value { overflow: hidden; text-overflow: ellipsis; color: #8ab4ff; }
  .var-value.getter  { color: inherit; opacity: .45; font-style: italic; }
  .var-value.changed { color: #e8c37e; }
  .var.openable { cursor: pointer; }
  .var-name::before { content: ''; display: inline-block; width: 1.6ch; opacity: .5; }
  .var.openable .var-name::before      { content: '\25B8'; }
  .var.openable.open .var-name::before { content: '\25BE'; }
  #console   { grid-row: 1; grid-column: 1; }
  #promptRow { grid-row: 2; grid-column: 1; }
  #console { overflow-y: auto; padding: .4rem .6rem; white-space: pre-wrap; min-height: 0; }
  #promptRow {
    display: flex; gap: .45rem; align-items: baseline;
    padding: .25rem .6rem .35rem; border-top: 1px solid var(--edge);
  }
  #promptMark { opacity: .45; }
  #promptLine {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--coffee); font: inherit; padding: 0;
  }
  .err { color: #ff6b6b; }
  .sys { opacity: .5; }
  .echo { opacity: .55; }
  .value { color: #8ab4ff; }
  .help-head { color: var(--coffee); font-weight: bold; margin-top: .5rem; }
  .help      { color: #d3d3d8; }
  .help-code { color: #a8d8a8; }
</style>

<header>
  <b>CoffeeBEANS</b>
  <button id="open" class="ghost icon" title="Open a sketch (Cmd/Ctrl-O)">&#128194;</button>
  <button id="evalRegion">&#9654; Eval</button>
  <button id="runFresh" class="ghost">&#8635; Run</button>
  <button id="pauseFrame" class="ghost icon" title="Hold the sketch at its next frame">&#10074;&#10074;</button>
  <button id="stepFrame" class="ghost icon" title="Let exactly one frame through">&#8677;</button>
  <button id="stepLine" class="ghost icon" title="Stop on the next line that runs (F10); Cmd/Ctrl-\ or F8 stops right now">&#8615;</button>
  <button id="stop" class="stop">&#9632; Stop</button>
  <span class="spacer"></span>
  <button id="toggle" class="ghost">Editor</button>
  <span id="lines"></span>
  <span id="meter"></span>
  <span id="status">booting</span>
</header>

<main id="main">
  <div id="stage"><canvas id="screen"></canvas></div>
  <div class="splitter v" id="splitEditor"></div>
  <div id="editor"></div>
</main>
<div class="splitter h" id="splitConsole"></div>
<div id="consolePane">
  <div id="console"></div>
  <div id="promptRow">
    <span id="promptMark">&gt;</span>
    <input id="promptLine" spellcheck="false" autocomplete="off" autocapitalize="off">
  </div>
  <div id="vars" hidden></div>
</div>

<script src="/src/renderer/vendor/coffeescript.js"></script>
<script src="/src/renderer/vendor/editor.js"></script>
<script>
  (async () => {
    for (const path of ['/src/runtime/layout.coffee',
                        '/src/runtime/keys.coffee',
                        '/src/renderer/help.coffee',
                        '/src/renderer/editor.coffee',
                        '/src/renderer/renderer.coffee']) {
      const source = await (await fetch(path)).text()
      ;(0, eval)(CoffeeScript.compile(source, { bare: false, filename: path }))
    }
  })()
</script>
