<meta charset="utf-8">
<title>CoffeeBEANS</title>
<style>
  :root {
    --coffee: #C0FFEE; --ink: #0b0b0d; --panel: #17171b; --edge: #2a2a30;
    --editor-w: 52ch; --console-h: 8rem; --grip: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid;
    grid-template-rows: auto 1fr var(--grip) var(--console-h);
    background: var(--ink); color: var(--coffee);
    font: 13px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
  }
  header {
    display: flex; gap: .5rem; align-items: center;
    padding: .4rem .6rem; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  header b { letter-spacing: .12em; }
  header .spacer { margin-left: auto; }
  button {
    font: inherit; border: 0; border-radius: 3px; padding: .25rem .6rem; cursor: pointer;
    color: var(--ink); background: var(--coffee);
  }
  /* A button that wraps puts its glyph on one line and its word on the next,
     which reads as two controls. The header would rather run out of room. */
  header button, header span { white-space: nowrap; }
  header button { flex: none; }
  /* Five buttons is more than the bar comfortably holds, so the two that
     only matter while a sketch is running wear their glyph alone. */
  header button.icon { padding: .25rem .5rem; }
  /* If it still does not fit, the meter is what gives -- the status is the
     one thing on this bar you cannot guess from looking at the window. */
  #meter { min-width: 0; overflow: hidden; }
  button.ghost { background: #22222a; color: var(--coffee); }
  button.stop  { background: #ff6b6b; }
  button:disabled { opacity: .35; cursor: default; }
  /* Stop grays and comes back on the console's timer as well as the status,
     and a prompt line at an idle worker is out for a millisecond or two:
     eased, so a tick that catches one does not flash the button. */
  #stop { transition: opacity .15s; }
  #status { opacity: .7; min-width: 6rem; text-align: right; }
  #meter  { opacity: .45; font-variant-numeric: tabular-nums; }
  #lines  { opacity: .6; font-variant-numeric: tabular-nums; }
  #lines.over { color: #ff6b6b; opacity: 1; }

  main { display: grid; grid-template-columns: 1fr var(--grip) var(--editor-w); min-height: 0; }
  main.solo { grid-template-columns: 1fr 0 0; }

  .splitter { background: var(--edge); touch-action: none; }
  .splitter:hover, .splitter.dragging { background: var(--coffee); }
  .splitter.v { cursor: col-resize; }
  .splitter.h { cursor: row-resize; }
  main.solo .splitter { display: none; }
  #stage { display: grid; place-items: center; overflow: hidden; background: #000; }
  canvas { image-rendering: pixelated; outline: 1px solid transparent; }
  #stage:focus { outline: none; }
  #stage:focus canvas { outline: 1px solid var(--coffee); }
  #editor { min-width: 0; overflow: hidden; }

  #consolePane {
    display: grid; grid-template-rows: 1fr auto; grid-template-columns: 1fr auto;
    min-height: 0; background: var(--panel);
  }
  /* Only there while a sketch is line paused, or after a runtime error to show
     its stack, so it costs the console nothing the rest of the time. */
  #vars {
    grid-row: 1 / span 2; grid-column: 2; width: 36ch; min-height: 0;
    overflow: auto; padding: .3rem 0; border-left: 1px solid var(--edge);
  }
  #vars[hidden] { display: none; }
  .vars-head  { padding: 0 .6rem .2rem; color: #e8c37e; }
  .vars-title { padding: .2rem .6rem 0; opacity: .5; }
  .var { display: flex; gap: .6rem; padding-right: .6rem; white-space: nowrap; }
  .var.none { opacity: .4; padding-left: 1.1rem; }
  .var-name  { flex: none; }
  .var-value { overflow: hidden; text-overflow: ellipsis; color: #8ab4ff; }
  .var-value.getter  { color: inherit; opacity: .45; font-style: italic; }
  .var-value.changed { color: #e8c37e; }
  .var.openable { cursor: pointer; }
  .var.runnable { cursor: pointer; }
  .var.runnable:hover .var-value.getter { opacity: .8; }
  .var-value.ran    { font-style: italic; }
  .var-value.thrown { color: #ff6b6b; }
  .var-name::before { content: ''; display: inline-block; width: 1.6ch; opacity: .5; }
  .var.openable .var-name::before      { content: '\25B8'; }
  .var.openable.open .var-name::before { content: '\25BE'; }
  .stack-head  { color: #ff6b6b; white-space: normal; }
  .stack-frame { display: flex; flex-direction: column; padding: .15rem .6rem .15rem 1.1rem; }
  .stack-frame.openable { cursor: pointer; }
  .stack-frame.openable:hover { background: #ffffff0a; }
  .stack-frame.chosen { box-shadow: inset 3px 0 0 #ff6b6b; background: #ff6b6b1a; }
  .stack-code { opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #console   { grid-row: 1; grid-column: 1; }
  #promptRow { grid-row: 2; grid-column: 1; }
  #console { overflow-y: auto; padding: .4rem .6rem; white-space: pre-wrap; min-height: 0; }
  #promptRow {
    display: flex; gap: .45rem; align-items: baseline;
    padding: .25rem .6rem .35rem; border-top: 1px solid var(--edge);
  }
  #promptMark { opacity: .45; }
  /* Tab's list of names, above the prompt and free to rise over the stage:
     the console alone is often four lines tall. --room is the measured space
     up to the header, set from the renderer. Above CodeMirror's gutters and
     panels (z-index 200 and 300), which a wide list can reach. */
  #promptRow { position: relative; }
  #completions {
    position: absolute; bottom: 100%; z-index: 400;
    min-width: 16ch; max-width: calc(100% - 2rem); overflow-y: auto;
    max-height: min(18em, var(--room, 18em));
    background: var(--panel); border: 1px solid var(--edge); border-bottom: 0;
  }
  .choice { padding: 0 .6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .choice:hover  { background: #ffffff0a; }
  .choice.chosen { background: #c0ffee26; }
  #promptLine {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--coffee); font: inherit; padding: 0;
  }
  .err { color: #ff6b6b; }
  .sys { opacity: .5; }
  .echo { opacity: .55; }
  .value { color: #8ab4ff; }
  .help-head { color: var(--coffee); font-weight: bold; margin-top: .5rem; }
  .help      { color: #d3d3d8; }
  .help-code { color: #a8d8a8; }

  /* Help > About, and the feedback report after it: a modal in the page. */
  dialog {
    background: var(--panel); color: var(--coffee);
    border: 1px solid var(--edge); border-radius: 4px; padding: 1rem 1.2rem;
  }
  dialog::backdrop { background: #000a; }
  dialog pre  { margin: 0 0 1rem; font: inherit; white-space: pre-wrap; }
  dialog form { display: flex; gap: .5rem; justify-content: flex-end; margin: 0; }
  dialog p    { margin: 0 0 .8rem; max-width: 72ch; }
  dialog label { display: block; margin-bottom: .4rem; }
  dialog textarea {
    display: block; width: 100%; margin-bottom: .8rem; padding: .4rem;
    background: var(--ink); color: var(--coffee); border: 1px solid var(--edge);
    font: inherit; resize: vertical;
  }
  #report { width: min(80ch, 90vw); }
</style>

<header>
  <b>CoffeeBEANS</b>
  <button id="feedback" class="ghost icon" title="Report a problem, or tell us what you think">&#128227;&#128030;</button>
  <button id="open" class="ghost icon" title="Open a sketch (Cmd/Ctrl-O)">&#128194;</button>
  <button id="evalRegion">&#9654; Eval</button>
  <button id="runFresh" class="ghost">&#8635; Run</button>
  <button id="pauseFrame" class="ghost icon" title="Hold the sketch at its next frame">&#10074;&#10074;</button>
  <button id="stepFrame" class="ghost icon" title="Let exactly one frame through">&#8677;</button>
  <button id="stepLine" class="ghost icon" title="Stop on the next line that runs (F10); Cmd/Ctrl-\ or F8 stops right now">&#8615;</button>
  <button id="stop" class="stop">&#9632; Stop</button>
  <span class="spacer"></span>
  <button id="toggle" class="ghost">Editor</button>
  <span id="lines"></span>
  <span id="meter"></span>
  <span id="status">booting</span>
</header>

<main id="main">
  <div id="stage"><canvas id="screen"></canvas></div>
  <div class="splitter v" id="splitEditor"></div>
  <div id="editor"></div>
</main>
<div class="splitter h" id="splitConsole"></div>
<div id="consolePane">
  <div id="console"></div>
  <div id="promptRow">
    <span id="promptMark">&gt;</span>
    <input id="promptLine" spellcheck="false" autocomplete="off" autocapitalize="off">
    <div id="completions" role="listbox" hidden></div>
  </div>
  <div id="vars" hidden></div>
</div>

<dialog id="about">
  <pre id="aboutText"></pre>
  <form method="dialog">
    <button id="aboutCopy" type="button" autofocus>Copy</button>
    <button id="aboutClose" class="ghost">Close</button>
  </form>
</dialog>

<!-- One step showing at a time: say what happened, check what will be
     saved, then where it went. -->
<dialog id="report">
  <div id="reportAsk" class="step">
    <label for="reportWords">What happened? What did you expect instead?</label>
    <textarea id="reportWords" rows="6"></textarea>
    <label><input id="reportSketch" type="checkbox"> Include the sketch that is open</label>
    <form method="dialog">
      <button id="reportDraft" type="button">Next</button>
      <button class="ghost">Cancel</button>
    </form>
  </div>
  <div id="reportCheck" class="step" hidden>
    <p>This is exactly what will be saved. Names, addresses and keys have been
    taken out; change or remove anything else you would rather not share.</p>
    <textarea id="reportText" rows="18" spellcheck="false"></textarea>
    <p id="reportRefused" hidden></p>
    <form method="dialog">
      <button id="reportSave" type="button">Save</button>
      <button class="ghost">Cancel</button>
    </form>
  </div>
  <div id="reportDone" class="step" hidden>
    <p id="reportSaved"></p>
    <form method="dialog">
      <button id="reportIssues" type="button">Open the issues page</button>
      <button id="reportClose" class="ghost">Close</button>
    </form>
  </div>
</dialog>

<script src="/src/renderer/vendor/coffeescript.js"></script>
<script src="/src/renderer/vendor/editor.js"></script>
<script>
  // A file that will not fetch, compile or run stops the app before
  // renderer.coffee's error listeners exist, and before 2026-10-06 that was
  // a dark window with an empty console (Claude's audit,
  // docs/research/unhandled-exceptions.md). So it is said here, in the
  // console, and nothing after it is loaded. The 404 is checked because its
  // body would otherwise be compiled, and fail as CoffeeScript.
  (async () => {
    for (const path of ['/src/runtime/layout.coffee',
                        '/src/runtime/keys.coffee',
                        '/src/renderer/help.coffee',
                        '/src/renderer/editor.coffee',
                        '/src/renderer/renderer.coffee']) {
      try {
        const response = await fetch(path)
        if (!response.ok) throw new Error(await response.text())
        ;(0, eval)(CoffeeScript.compile(await response.text(), { bare: false, filename: path }))
      } catch (error) {
        const line = document.createElement('div')
        line.className = 'err'
        line.textContent = `CoffeeBEANS could not start -- ${path}: ${error}`
        document.getElementById('console').append(line)
        console.error(error)
        return
      }
    }
  })()
</script>
